name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # lets the last step refresh the public download
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          # Only the NSIS setup (Wynko_<version>_x64-setup.exe): it carries the
          # installer hooks (elevated task, removal of the old revm2-desktop
          # install). The .msi and the bare exe skip those, so they're left out.
          name: wynko-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe

      # The public download link (downloads/index.html) points at this
      # release asset, so it always serves the newest build from main.
      # Branch runs only produce the artifact above.
      - name: Publish the download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle/nsis
          cp ./*-setup.exe Wynko-Setup.exe
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest \
            --title "Wynko for Windows (latest)" \
            --notes "Newest Windows installer built from main. Download Wynko-Setup.exe." \
            --latest=false
          gh release upload desktop-latest Wynko-Setup.exe --clobber
