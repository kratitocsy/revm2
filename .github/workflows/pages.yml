name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Rebuilds every generated, committed-at-root artifact from current
      # source before deploying, so the live site can never drift behind
      # source the way home-app-dist/home-app.js did (stale ~9 commits,
      # still showing the old Focus Lock "Subject Timer" panel after it
      # had been replaced with a Tasks checklist in DesktopDashboard.tsx).
      # Each of these previously required someone to remember to run the
      # matching `npm run build:*` script and commit its output by hand:
      #   - build:css      -> src/styles/tailwind.build.css
      #   - build:shared   -> shared.js (src/lib, IIFE bundle)
      #   - build:sidebars -> stamps Sidebar.js into the static HTML pages
      #   - build:mobile-home      -> mobile-home.html + assets/mobile-home-*
      #   - build:desktop-dashboard -> home-app-dist/home-app.{js,css}
      # Running them here means the deploy always reflects current
      # source; committing the rebuilt output is no longer required for
      # correctness (only for local `file://`/preview convenience).
      - name: Build generated assets
        run: |
          npm run build:css
          npm run build:shared
          npm run build:sidebars
          npm run build:mobile-home
          npm run build:desktop-dashboard
      # The Windows installer is built by build-desktop.yml and published as a
      # release asset. Copy the newest one into the site so the Download button
      # on /downloads serves it directly from wynko.in (same as the extension
      # zip). It is never committed. If the copy fails, point the button back at
      # the release asset so the page never ships a dead link.
      - name: Attach the Windows installer
        shell: bash
        run: |
          URL=https://github.com/kratitocsy/revm2/releases/download/desktop-latest/Wynko-Setup.exe
          OUT=downloads/Wynko-Setup-x64.exe
          if curl -fL --retry 3 --retry-delay 5 -o "$OUT" "$URL" \
             && [ "$(stat -c%s "$OUT")" -gt 1000000 ] \
             && [ "$(head -c2 "$OUT")" = "MZ" ]; then
            echo "Attached $(stat -c%s "$OUT") bytes"
          else
            echo "::warning::Could not fetch the installer; linking the button to the release instead."
            rm -f "$OUT"
            sed -i 's#href="Wynko-Setup-x64.exe" download="Wynko-Setup-x64.exe"#href="'"$URL"'"#' downloads/index.html
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
