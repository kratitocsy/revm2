<!doctype html>
<!--
  Offscreen document - exists purely to keep a network connection alive
  past the ~30s idle timeout that would otherwise suspend background.js
  (an MV3 service worker). Offscreen documents are ordinary DOM pages with
  no such lifecycle - they stay open until the extension explicitly closes
  them (see ensureOffscreenDocument() / closeOffscreenDocument() in
  background.js).

  It talks to the desktop app's local session bridge (see
  desktop/src-tauri/src/session_bridge.rs), never Supabase or any remote
  host - see offscreen.js for what it actually does.
-->
<html>
  <head><meta charset="utf-8"></head>
  <body>
    <script src="offscreen.js"></script>
  </body>
</html>
