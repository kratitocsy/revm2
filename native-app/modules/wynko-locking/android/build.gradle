plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.wynko.locking'
version = '0.1.0'

android {
  namespace "com.wynko.locking"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // WynkoVpnService's DNS forwarding loop runs on coroutines
  // (same dependency the Capacitor app declares in app/build.gradle).
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
